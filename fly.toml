# Fly.io config — 0G Memory Wallet Telegram bot.
# A single always-on machine running grammY long-polling (no public HTTP).
# App name must be globally unique on Fly — change it before launching.
app = "galileo-wallet-bot"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  # Persist wallet data on the volume mounted at /data (NOT the ephemeral rootfs).
  WALLET_STORE_PATH = "/data/wallets.json"

# Persistent storage for encrypted wallet records + active-wallet selection.
[mounts]
  source = "galileo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
